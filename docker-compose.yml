services:
  portfolio:
    build:
      context: .
      target: runtime
    image: ${PORTFOLIO_IMAGE:-ghcr.io/dumdart/portfoliohub:latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:4321:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
